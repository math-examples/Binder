<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Binder — Universal File Merger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f5f5f7;--text:#1d1d1f;--text-secondary:#86868b;--card-bg:rgba(255,255,255,.72);--card-border:rgba(0,0,0,.08);--primary:#007aff;--primary-hover:#006ae6;--shadow:0 8px 30px rgba(0,0,0,.08);--radius:16px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--text:#f5f5f7;--text-secondary:#98989d;--card-bg:rgba(44,44,46,.72);--card-border:rgba(255,255,255,.1);--shadow:0 8px 30px rgba(0,0,0,.3)}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;padding:40px 20px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
.container{max-width:680px;width:100%;background:var(--card-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--card-border);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow)}
h1{font-size:28px;font-weight:700;margin-bottom:8px;letter-spacing:-.5px}
.subtitle{font-size:15px;color:var(--text-secondary);margin-bottom:28px;line-height:1.5}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;background:rgba(142,142,147,.15);color:var(--text-secondary);border:none;flex:1}
.tab.active{background:var(--primary);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
.drop-zone{border:2px dashed var(--card-border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--primary);background:rgba(0,122,255,.05)}
.drop-zone p{font-size:15px;margin-bottom:16px}
.url-input{width:100%;padding:14px;background:var(--bg);color:var(--text);border:1px solid var(--card-border);border-radius:8px;font-size:16px;margin-bottom:12px}
.btn{display:inline-block;padding:14px 28px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;margin:6px}
.btn:hover{background:var(--primary-hover)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.options{background:rgba(142,142,147,.1);border-radius:8px;padding:16px;margin-bottom:20px;display:none;font-size:14px}
.options label{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer}
.progress-wrap{display:none;margin:20px 0}
.progress-bar{height:8px;background:rgba(142,142,147,.2);border-radius:8px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;width:0%;background:var(--primary);transition:width .2s}
.progress-text{font-size:12px;color:var(--text-secondary)}
.file-list{background:rgba(142,142,147,.1);border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:20px;display:none;max-height:200px;overflow-y:auto}
.file-list ul{list-style:none}
.file-list li{padding:4px 0;display:flex;align-items:center;gap:8px}
.file-list li::before{content:"✓";color:#34c759;font-weight:700}
.output-section{display:none}
.output-section label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.output-section textarea{width:100%;height:200px;background:rgba(142,142,147,.1);border:1px solid var(--card-border);border-radius:8px;padding:12px;font-family:"SF Mono",Menlo,monospace;font-size:12px;color:var(--text);resize:vertical;margin-bottom:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-secondary{background:rgba(142,142,147,.2);color:var(--text)}
.status{font-size:13px;color:var(--text-secondary);margin-top:12px}
.error{color:#ff3b30}.success{color:#34c759}.warning{color:#ff9500}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<h1>Binder</h1>
<p class="subtitle">Universal file merger. Upload a <strong>ZIP</strong> or paste a <strong>URL</strong> — Binder inlines all CSS, JavaScript, images, fonts, and <code>@import</code> rules into a single standalone HTML file.</p>

<div class="tabs">
<button class="tab active" data-tab="zip">📦 Upload ZIP</button>
<button class="tab" data-tab="url">🔗 Paste URL</button>
</div>

<div class="tab-content active" id="tabZip">
<div class="drop-zone" id="dropZone">
<p>Drop your project ZIP here or tap to browse</p>
<button class="btn" id="selectZipBtn">Choose ZIP File</button>
<input type="file" id="zipInput" accept=".zip" style="display:none">
</div>
</div>

<div class="tab-content" id="tabUrl">
<input type="url" class="url-input" id="urlInput" placeholder="https://example.com">
<button class="btn" id="fetchUrlBtn">Fetch & Merge</button>
</div>

<div class="progress-wrap" id="progressWrap">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-text" id="progressText">0%</div>
</div>

<div class="options" id="options">
<label><input type="checkbox" id="stripMaps" checked> Strip source maps (.map files)</label>
<label><input type="checkbox" id="minifyOpt"> Minify output (smaller file)</label>
</div>

<div class="file-list" id="fileList"><ul id="fileListUl"></ul></div>

<div class="output-section" id="outputSection">
<label for="output">Merged HTML:</label>
<textarea id="output" readonly></textarea>
<div class="actions">
<button class="btn" id="downloadBtn">Download Standalone HTML</button>
<button class="btn btn-secondary" id="copyBtn">Copy to Clipboard</button>
</div>
<p class="status" id="status"></p>
</div>
</div>

<script>
// --- CORS Proxy (using allorigins for demo) ---
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

let fileMap = new Map();
let mergedHTML = '';
let htmlFileName = '';

const tabs = document.querySelectorAll('.tab');
const tabZip = document.getElementById('tabZip');
const tabUrl = document.getElementById('tabUrl');
const zipInput = document.getElementById('zipInput');
const dropZone = document.getElementById('dropZone');
const urlInput = document.getElementById('urlInput');
const fetchUrlBtn = document.getElementById('fetchUrlBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const options = document.getElementById('options');
const stripMaps = document.getElementById('stripMaps');
const minifyOpt = document.getElementById('minifyOpt');
const fileList = document.getElementById('fileList');
const fileListUl = document.getElementById('fileListUl');
const outputSection = document.getElementById('outputSection');
const output = document.getElementById('output');
const status = document.getElementById('status');
const selectZipBtn = document.getElementById('selectZipBtn');
const downloadBtn = document.getElementById('downloadBtn');
const copyBtn = document.getElementById('copyBtn');

const BINARY_EXT = /\.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf|otf|eot|avif|heic)$/i;
const TEXT_EXT = /\.(html?|css|js|json|xml|txt|md|svg)$/i;

// --- Tab Switching ---
tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        tabZip.classList.remove('active');
        tabUrl.classList.remove('active');
        document.getElementById('tab' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
        outputSection.style.display = 'none';
        fileMap.clear();
    });
});

// --- ZIP Handling (same as before) ---
selectZipBtn.addEventListener('click', e => { e.preventDefault(); zipInput.click(); });
zipInput.addEventListener('change', e => { if (e.target.files[0]) loadZip(e.target.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.zip')) loadZip(file);
    else showStatus('Please drop a ZIP file.', 'error');
});

async function loadZip(zipFile) {
    progressWrap.style.display = 'block'; options.style.display = 'none'; outputSection.style.display = 'none'; fileMap.clear();
    try {
        const zip = await JSZip.loadAsync(zipFile, { onUpdate: (meta) => {
            progressFill.style.width = meta.percent + '%'; progressText.textContent = Math.round(meta.percent) + '%';
        }});
        const promises = [];
        zip.forEach((path, zipEntry) => {
            if (zipEntry.dir) return;
            const p = path.replace(/\\/g, '/');
            fileMap.set(p, { text: null, binary: null });
            if (BINARY_EXT.test(p)) promises.push(zipEntry.async('arraybuffer').then(b => fileMap.get(p).binary = b));
            else if (TEXT_EXT.test(p)) promises.push(zipEntry.async('string').then(t => fileMap.get(p).text = t));
        });
        await Promise.all(promises);
        progressWrap.style.display = 'none';
        showStatus(`✓ Extracted ${fileMap.size} files.`, 'success');
        finishAndMerge('index.html');
    } catch (e) { progressWrap.style.display = 'none'; showStatus('Error: ' + e.message, 'error'); }
}

// --- URL Fetching ---
fetchUrlBtn.addEventListener('click', async () => {
    let url = urlInput.value.trim();
    if (!url) return showStatus('Please enter a URL', 'error');
    if (!url.startsWith('http')) url = 'https://' + url;
    
    progressWrap.style.display = 'block'; options.style.display = 'none'; outputSection.style.display = 'none'; fileMap.clear();
    showStatus('<span class="spinner"></span> Fetching page...', '');
    
    try {
        const response = await fetch(CORS_PROXY + encodeURIComponent(url));
        const htmlText = await response.text();
        const baseUrl = new URL(url);
        const baseDir = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/') + 1);
        const origin = baseUrl.origin;
        
        // Store main HTML
        const mainPath = 'index.html';
        fileMap.set(mainPath, { text: htmlText, binary: null });
        
        // Parse to find assets
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const assetUrls = new Set();
        
        // CSS links
        doc.querySelectorAll('link[rel="stylesheet"], link[href$=".css"]').forEach(l => {
            const href = l.getAttribute('href'); if (href) assetUrls.add(new URL(href, baseUrl).href);
        });
        // JS
        doc.querySelectorAll('script[src]').forEach(s => {
            const src = s.getAttribute('src'); if (src) assetUrls.add(new URL(src, baseUrl).href);
        });
        // Images
        doc.querySelectorAll('img[src]').forEach(i => {
            const src = i.getAttribute('src'); if (src) assetUrls.add(new URL(src, baseUrl).href);
        });
        // CSS @import and url() will be handled recursively during merge
        
        // Fetch all assets
        let fetched = 0;
        const total = assetUrls.size;
        for (const assetUrl of assetUrls) {
            try {
                const ext = assetUrl.split('.').pop().split('?')[0].toLowerCase();
                const path = assetUrl.replace(origin + '/', '');
                if (BINARY_EXT.test(assetUrl)) {
                    const resp = await fetch(CORS_PROXY + encodeURIComponent(assetUrl));
                    const buf = await resp.arrayBuffer();
                    fileMap.set(path, { text: null, binary: buf });
                } else if (TEXT_EXT.test(assetUrl)) {
                    const resp = await fetch(CORS_PROXY + encodeURIComponent(assetUrl));
                    const txt = await resp.text();
                    fileMap.set(path, { text: txt, binary: null });
                }
            } catch (e) { console.warn('Failed to fetch:', assetUrl); }
            fetched++;
            progressFill.style.width = (fetched / total * 100) + '%';
            progressText.textContent = `Fetched ${fetched}/${total} assets`;
        }
        
        progressWrap.style.display = 'none';
        showStatus(`✓ Fetched ${fileMap.size} resources.`, 'success');
        finishAndMerge(mainPath, baseDir);
    } catch (e) {
        progressWrap.style.display = 'none';
        showStatus('Error fetching URL: ' + e.message + '<br><small>Try a different CORS proxy or use ZIP upload.</small>', 'error');
    }
});

function finishAndMerge(mainPath, baseDirOverride) {
    options.style.display = 'block';
    stripMaps.onchange = () => doMerge(mainPath, baseDirOverride);
    minifyOpt.onchange = () => doMerge(mainPath, baseDirOverride);
    doMerge(mainPath, baseDirOverride);
    
    fileListUl.innerHTML = '';
    [...fileMap.keys()].sort().forEach(p => { const li = document.createElement('li'); li.textContent = p; fileListUl.appendChild(li); });
    fileList.style.display = 'block';
}

function doMerge(mainPath, baseDirOverride) {
    let files = new Map(fileMap);
    if (stripMaps.checked) for (const [path] of [...files]) if (path.endsWith('.map')) files.delete(path);
    
    const originalMap = fileMap; fileMap = files;
    try {
        const baseDir = baseDirOverride || getBaseDir(mainPath);
        const htmlText = files.get(mainPath).text;
        htmlFileName = 'page';
        let result = mergeHTML(htmlText, baseDir);
        if (minifyOpt.checked) result = result.replace(/\s+/g, ' ').replace(/>\s+</g, '><').trim();
        mergedHTML = result;
        output.value = mergedHTML;
        outputSection.style.display = 'block';
        const sizeKB = Math.round(new Blob([mergedHTML]).size / 1024);
        if (sizeKB > 5000) showStatus(`⚠️ Output is ${sizeKB}KB — may be slow on mobile.`, 'warning');
        else showStatus(`✓ Merged ${files.size} files (${sizeKB}KB). Ready!`, 'success');
    } catch (e) { showStatus('Error: ' + e.message, 'error'); }
    finally { fileMap = originalMap; }
}

// --- Merging Engine (same as before) ---
function mergeHTML(htmlText, baseDir) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');
    
    const links = [...doc.querySelectorAll('link[rel="stylesheet"], link[href$=".css"]')];
    for (const link of links) {
        const href = link.getAttribute('href');
        const cssPath = resolvePath(baseDir, href);
        if (cssPath && fileMap.has(cssPath)) {
            let cssText = fileMap.get(cssPath).text || '';
            cssText = inlineCSSImports(cssText, getBaseDir(cssPath));
            cssText = inlineCSSAssets(cssText, getBaseDir(cssPath));
            const style = doc.createElement('style'); style.textContent = cssText;
            link.parentNode.replaceChild(style, link);
        }
    }
    
    const scripts = [...doc.querySelectorAll('script[src]')];
    for (const script of scripts) {
        const src = script.getAttribute('src');
        const jsPath = resolvePath(baseDir, src);
        if (jsPath && fileMap.has(jsPath)) {
            const jsText = fileMap.get(jsPath).text || '';
            const newScript = doc.createElement('script'); newScript.textContent = jsText;
            [...script.attributes].forEach(attr => { if (attr.name !== 'src') newScript.setAttribute(attr.name, attr.value); });
            script.parentNode.replaceChild(newScript, script);
        }
    }
    
    const imgs = [...doc.querySelectorAll('img[src]')];
    for (const img of imgs) {
        const src = img.getAttribute('src');
        const imgPath = resolvePath(baseDir, src);
        if (imgPath && fileMap.has(imgPath)) { const dataURI = getDataURI(imgPath); if (dataURI) img.src = dataURI; }
    }
    
    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

function inlineCSSAssets(cssText, cssBaseDir) {
    return cssText.replace(/url\(['"]?([^'")]+)['"]?\)/gi, (match, url) => {
        if (/^https?:\/\//i.test(url) || url.startsWith('//') || url.startsWith('data:')) return match;
        const assetPath = resolvePath(cssBaseDir, url);
        if (assetPath && fileMap.has(assetPath)) { const dataURI = getDataURI(assetPath); if (dataURI) return `url(${dataURI})`; }
        return match;
    });
}

function inlineCSSImports(cssText, cssBaseDir) {
    return cssText.replace(/@import\s+(?:url\(['"]?([^'"]+)['"]?\)|['"]([^'"]+)['"])\s*;?/gi, (match, url1, url2) => {
        const importUrl = url1 || url2;
        if (!importUrl) return match;
        const importPath = resolvePath(cssBaseDir, importUrl);
        if (importPath && fileMap.has(importPath)) {
            let importedCss = fileMap.get(importPath).text || '';
            importedCss = inlineCSSImports(importedCss, getBaseDir(importPath));
            importedCss = inlineCSSAssets(importedCss, getBaseDir(importPath));
            return importedCss;
        }
        return match;
    });
}

function getDataURI(path) {
    const entry = fileMap.get(path); if (!entry) return null;
    const ext = path.split('.').pop().toLowerCase();
    const mime = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', svg:'image/svg+xml', webp:'image/webp', ico:'image/x-icon', woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf', otf:'font/otf' }[ext] || 'application/octet-stream';
    if (entry.binary) return `data:${mime};base64,${arrayBufferToBase64(entry.binary)}`;
    else if (entry.text && ext === 'svg') return `data:image/svg+xml;utf8,${encodeURIComponent(entry.text)}`;
    return null;
}

function arrayBufferToBase64(buffer) { let binary=''; const bytes=new Uint8Array(buffer); for(let i=0;i<bytes.byteLength;i++) binary+=String.fromCharCode(bytes[i]); return btoa(binary); }
function getBaseDir(filePath) { const lastSlash = filePath.lastIndexOf('/'); return lastSlash === -1 ? '' : filePath.substring(0, lastSlash + 1); }
function resolvePath(baseDir, relative) {
    let clean = relative.split('?')[0].split('#')[0];
    if (/^https?:\/\//i.test(clean) || clean.startsWith('//') || clean.startsWith('data:')) return null;
    try { const base = `http://dummy.com/${baseDir}`; return decodeURIComponent(new URL(clean, base).pathname.slice(1)); } catch { return null; }
}
function showStatus(msg, type) { status.innerHTML = msg; status.className = 'status ' + type; }

downloadBtn.addEventListener('click', () => {
    if (!mergedHTML) return;
    const blob = new Blob([mergedHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = `${htmlFileName}-standalone.html`; a.click(); URL.revokeObjectURL(url);
    showStatus('✓ Downloaded as ' + a.download, 'success');
});

copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(output.value); showStatus('✓ Copied!', 'success'); }
    catch { output.select(); document.execCommand('copy'); showStatus('✓ Copied!', 'success'); }
});
</script>
</body>
</html>
